[package]
name = "nitrosense"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Fan control and system monitoring for Acer Nitro laptops"
license = "GPL-3.0"

[dependencies]
eframe = { version = "0.31", features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.31"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
libc = "0.2"
nix = { version = "0.29", features = ["ioctl", "process", "fs"] }
clap = "4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
rstest = "0.24"
assert_cmd = "2"
predicates = "3"
serial_test = "3"
egui_kittest = "0.31"
accesskit = "0.17"

[build-dependencies]
cc = "1"

[features]
default = []
hardware-tests = []

[[bench]]
name = "ec_bench"
harness = false

[[bench]]
name = "power_bench"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
