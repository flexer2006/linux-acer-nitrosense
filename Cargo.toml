[package]
name = "nitrosense"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Fan control and system monitoring for Acer Nitro laptops"
license = "GPL-3.0"

[dependencies]
# eframe's default features also link wgpu. The Hyprland build stays on glow.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
thiserror = "2"
anyhow = "1"
libc = "0.2"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11", "x11-dl"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
rstest = "0.24"
assert_cmd = "2"
predicates = "3"
serial_test = "3"
egui_kittest = "0.36"
accesskit = "0.24.1"

[build-dependencies]
cc = "1"

[features]
default = []
hardware-tests = []

[[bench]]
name = "ec_bench"
harness = false

[[bench]]
name = "power_bench"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
