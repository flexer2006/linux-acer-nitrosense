[advisories]
# Vulnerability advisories are denied by default
[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "paste is an unmaintained transitive dependency of eframe via accesskit_windows; no vulnerability, no upgrade path available within eframe 0.31"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "GPL-3.0",
  "GPL-3.0-or-later",
  "LGPL-3.0",
  "LGPL-3.0-or-later",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "NOASSERTION",
  "OFL-1.1",
  "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
